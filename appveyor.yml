version: 1.0.{build}
image: Visual Studio 2022
clone_depth: 1

environment:
  MSBUILDDISABLENODEREUSE: 1
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

# Cache MSVC intermediate/output dirs so MSBuild only recompiles changed files.
cache:
  - Release
  - Release_Version

test: off

install:
  - cmd: echo "Ready to build"

build_script:
  # /m parallelizes MSBuild; the project already sets MultiProcessorCompilation=true,
  # which uses all logical processors by default (so no CL_MPCount override is needed).
  - msbuild SickoMenu.sln /m /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /verbosity:minimal
  - msbuild SickoMenu.sln /m /p:Configuration=Release_Version /p:Platform=x86 /p:PlatformToolset=v143 /verbosity:minimal

after_build:
  - ps: |
      New-Item -ItemType Directory -Force -Path dist | Out-Null
      Copy-Item Release\SickoMenu.dll dist\ -Force
      Copy-Item Release_Version\version.dll dist\ -Force
      Copy-Item LICENSE dist\ -Force

artifacts:
  - path: dist
    name: SickoMenu_Itch_x86
    type: zip
